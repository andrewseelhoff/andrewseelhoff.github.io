    Publications:
      - title: Adapting Biomimetic Kinematics for Controlling a Powered-Knee, Passive-Ankle Prosthesis Across Inclines
        authors:
          - C. A. Seelhoff
          - T. K. Best
          - R. D. Gregg
        publisher: IEEE Int Conf Rehab Robotics (ICORR)
        releaseDate: 2025-05-01
        url: https://locolab.robotics.umich.edu/documents/SeelhoffGregg-ICORR2025.pdf
        summary: This conference paper introduces my adaptaitons to Kevin Best's Hybrid Kinematic Impedance Control. My adaptaions adjust knee control commands to account for a passive ankle during inclined walking.

      - title: Implementation and Validation of a Data-Driven Variable Impedance Controller on the Össur Power Knee
        authors:
          - T. K. Best
          - C. A. Seelhoff
          - R. D. Gregg
        publisher: IEEE Int Conf Rehab Robotics (ICORR)
        releaseDate: 2025-05-01
        url: https://locolab.robotics.umich.edu/documents/BestGregg-ICORR2025.pdf
        summary: This paper details adaptations to Hybrid Kinematic Impedance cotrol in level ground and sit-stand tasks to enable use on the commercially-available Össur Power Knee.

      - title: The clinical effects of the Össur Power Knee with phase-based and default control during sitting, standing and walking
        authors:
          - T. K. Best
          - C. A. Seelhoff
          - J. Wensman
          - R. D. Gregg
        publisher: Journal of NeuroEngineering and Rehabilitation (JNER)
        releaseDate: 2025-09-29
        url: https://link.springer.com/article/10.1186/s12984-025-01729-2
        summary: In an n = 7 trial, we compare the Power Knee's stock controller to our adapted HKIC paradigm as well as users' take-home devices across a range of sitting, standing, and walking activities to determine whether results observed on prototype hardware can be observed on commercial devices.

